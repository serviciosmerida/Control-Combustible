<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Combustible · Servigrúas Mérida</title>
<link rel="icon" type="image/png" sizes="512x512" href="logogas.png">
<link rel="apple-touch-icon" sizes="512x512" href="logogas.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1A1A">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#1A1A1A; --cream:#F7F5F0; --gray-light:#EEECE8; --gray-mid:#D5D2CB;
    --gray-text:#888580; --olive:#4A5240; --olive-light:#EFF1EB;
    --amber:#C8860A; --red:#B03A2E; --green:#2E7D32; --blue:#1F5C9E;
    --bg: #F7F5F0; --surface: #ffffff; --border: #EEECE8;
    --text: #1A1A1A; --text-sub: #888580; --topbar: #1A1A1A;
  }
  [data-theme="dark"] {
    --bg: #121212; --surface: #1E1E1E; --border: #2E2E2E;
    --text: #F0EEE9; --text-sub: #888580; --topbar: #0A0A0A;
    --gray-light: #2E2E2E; --gray-mid: #3A3A3A; --cream: #121212;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:2rem; transition:background .2s,color .2s; }

  .topbar {
    background:var(--topbar); color:#fff; padding:1rem 1.25rem;
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-brand { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:2px; }
  .topbar-brand span { color:var(--amber); }
  .topbar-sub { font-size:.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

  .btn-theme {
    background:none; border:1.5px solid rgba(255,255,255,.25);
    border-radius:50%; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.1rem; transition:border-color .15s; flex-shrink:0;
  }
  .btn-theme:hover { border-color:rgba(255,255,255,.6); }

  .form-wrap { padding:1.25rem; max-width:520px; margin:0 auto; }

  .group {
    background:var(--surface); border-radius:14px; border:1.5px solid var(--border);
    padding:1.1rem; margin-bottom:1rem; transition:background .2s,border-color .2s;
  }
  .group-title {
    font-size:.68rem; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--olive); font-weight:700; margin-bottom:.85rem;
  }

  .field { margin-bottom:.9rem; }
  .field:last-child { margin-bottom:0; }
  .field label { display:block; font-size:.78rem; font-weight:600; color:var(--text); margin-bottom:.35rem; }
  .field input, .field select {
    width:100%; padding:.7rem .85rem; border-radius:10px;
    border:1.5px solid var(--gray-mid); font-size:.95rem;
    font-family:'Inter',sans-serif; background:var(--surface); color:var(--text);
    -webkit-appearance:none; appearance:none;
    transition:background .2s,border-color .2s,color .2s;
  }
  .field input:focus, .field select:focus { outline:none; border-color:var(--olive); }
  .field input[readonly] { background:var(--gray-light); font-weight:700; }

  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }

  select { background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888580' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right .75rem center; background-size:18px; padding-right:2.2rem; }

  .btn-guardar {
    width:100%; background:var(--olive); color:#fff; border:none;
    border-radius:12px; padding:1rem; font-size:1rem; font-weight:700;
    cursor:pointer; margin-top:.5rem; transition:background .15s;
  }
  .btn-guardar:active { background:#3a4132; }
  .btn-guardar:disabled { background:var(--gray-mid); cursor:not-allowed; }

  .btn-limpiar {
    width:100%; background:transparent; color:var(--text-sub);
    border:1.5px solid var(--gray-mid); border-radius:12px; padding:.7rem;
    font-size:.85rem; font-weight:600; cursor:pointer; margin-top:.6rem;
  }

  .toast {
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--green); color:#fff; padding:.85rem 1.5rem; border-radius:12px;
    font-size:.88rem; font-weight:600; transition:transform .25s;
    box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:50; max-width:90%; text-align:center;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.error { background:var(--red); }

  .req { color:var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left" style="display:flex; align-items:center; gap:10px;">
    <img src="logogas.png" alt="Logo" style="height:36px; width:auto; border-radius:6px;" onerror="this.style.display='none'">
    <div>
      <div class="topbar-brand">Servigrúas <span>Mérida</span></div>
      <div class="topbar-sub">Control de combustible</div>
    </div>
  </div>
  <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Cambiar modo">🌙</button>
</div>

<form class="form-wrap" id="form">

  <div class="group">
    <div class="group-title">Carga de combustible</div>
    <div class="field">
      <label>Fecha <span class="req">*</span></label>
      <input type="date" id="fecha" required>
    </div>
    <div class="field">
      <label>No. Placa <span class="req">*</span></label>
      <select id="placa" required>
        <option value="">Selecciona...</option>
        <option>C621BRK</option>
        <option>C544BVM</option>
        <option>C903BSX</option>
        <option>C301BXY</option>
        <option>C765CBV</option>
        <option>C792BRD</option>
        <option>VIALES</option>
        <option>TAXI OSMAR</option>
        <option>TAXI OLIVER</option>
        <option>TAXI EDGAR</option>
      </select>
    </div>
    <div class="field">
      <label>Conductor <span class="req">*</span></label>
      <input type="text" id="conductor" placeholder="Ej. Douglas" required>
    </div>
  </div>

  <div class="group">
    <div class="group-title">Montos</div>
    <div class="row2">
      <div class="field">
        <label>Galones <span class="req">*</span></label>
        <input type="number" id="galones" step="0.01" inputmode="decimal" required>
      </div>
      <div class="field">
        <label>Precio x Galón (Q) <span class="req">*</span></label>
        <input type="number" id="precio" step="0.01" inputmode="decimal" required>
      </div>
    </div>
    <div class="field">
      <label>Total Q</label>
      <input type="text" id="total" readonly placeholder="0.00">
    </div>
    <div class="field">
      <label>Forma de Pago <span class="req">*</span></label>
      <select id="formaPago" required>
        <option value="">Selecciona...</option>
        <option>Tarjeta</option>
        <option>Efectivo</option>
      </select>
    </div>
  </div>

  <button type="submit" class="btn-guardar" id="btnGuardar">💾 Guardar carga</button>
  <button type="button" class="btn-limpiar" id="btnLimpiar">Limpiar formulario</button>

</form>

<div class="toast" id="toast"></div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwyIFEZAS3D0DodDCQ5VoKMHirmBg88ifgwwc_j0q6VKg21Bgq5PPeDABlmR-v2EBUI7Q/exec';

const form       = document.getElementById('form');
const btnGuardar = document.getElementById('btnGuardar');
const toast      = document.getElementById('toast');
const galones    = document.getElementById('galones');
const precio     = document.getElementById('precio');
const total      = document.getElementById('total');

function setFechaHoy() {
  const hoy = new Date();
  const yyyy = hoy.getFullYear();
  const mm   = String(hoy.getMonth() + 1).padStart(2, '0');
  const dd   = String(hoy.getDate()).padStart(2, '0');
  document.getElementById('fecha').value = `${yyyy}-${mm}-${dd}`;
}
setFechaHoy();

function calcTotal() {
  const t = (parseFloat(galones.value) || 0) * (parseFloat(precio.value) || 0);
  total.value = t > 0 ? t.toFixed(2) : '';
}
galones.addEventListener('input', calcTotal);
precio.addEventListener('input', calcTotal);

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('btnTheme').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}
(function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('btnTheme').textContent = '☀️';
  }
})();

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

function limpiarFormulario() {
  form.reset();
  total.value = '';
  setFechaHoy();
}
document.getElementById('btnLimpiar').addEventListener('click', limpiarFormulario);

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const fechaVal = document.getElementById('fecha').value;
  const fechaObj = new Date(fechaVal + 'T00:00:00');
  const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

  const g = parseFloat(galones.value);
  const p = parseFloat(precio.value);

  const data = {
    fecha:     fechaVal,
    mes:       MESES[fechaObj.getMonth()],
    anio:      fechaObj.getFullYear(),
    placa:     document.getElementById('placa').value,
    conductor: document.getElementById('conductor').value.trim(),
    galones:   g,
    precio:    p,
    total:     Math.round(g * p * 100) / 100,
    formaPago: document.getElementById('formaPago').value,
  };

  btnGuardar.disabled = true;
  btnGuardar.textContent = 'Guardando...';

  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'text/plain' }
    });
    const result = await resp.json();

    if (result.ok) {
      showToast('✅ Carga guardada correctamente.');
      limpiarFormulario();
    } else {
      showToast('⚠ Error: ' + (result.error || 'Desconocido'), true);
    }
  } catch (err) {
    showToast('⚠ No se pudo conectar. Revisa tu internet.', true);
  } finally {
    btnGuardar.disabled = false;
    btnGuardar.textContent = '💾 Guardar carga';
  }
});
</script>
</body>
</html>
